<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar pago</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="modal-overlay" id="paymentModal">
    
    <div class="modal-content">
      <div class="modal-header">
        <h2>Procesar pago</h2>
        <button class="modal-close" onclick="document.getElementById('paymentModal').style.display='none'">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="total-display">
          <p style="font-weight: bold; text-transform: uppercase; font-size: 0.85rem;">Total a Cobrar</p>
          <h3>$850.00</h3>
        </div>

        <h2 style="font-weight: bold; margin-bottom: 10px;">Datos del cliente</h2>

        <div class="form-group">
          <label for="username">Nombre</label>
          <input type="text" id="username" name="username" readonly>
          <label for="numeroTelefoono">Número de teléfono</label>
          <input type="text" id="numeroTelefono" name="numeroTelefono" readonly>
        </div>

        <p style="font-weight: bold; margin-bottom: 10px;">Número de tarjeta:</p>
        <div class="form-group">
          <input type="number" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" required>
          
        </div>

        <!-- Formulario a conectar con PaymentController (generando EncryptedPayloadDto) -->
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem;">
            Confirmar cobro seguro
          </button>
          <button class="btn btn-danger" style="width: 100%; padding: 12px; font-size: 1rem;" onclick="document.getElementById('paymentModal').style.display='none'">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
</body>    
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Terminal POS - Tienda Ropa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="pos-layout">
    <!-- SECCIÓN IZQUIERDA: CATÁLOGO -->
    <div class="pos-catalog">
      <header class="pos-header">
        <h1 style="color: var(--brand-dark);">Terminal POS - Ropa</h1>
        <div style="color: var(--brand-teal); font-weight: bold;">Empleado: Juan Pérez</div>
      </header>

      <div class="product-grid">
        <!-- Tarjeta Producto 1 -->
        <div class="product-card">
          <div class="product-img">[Foto Chamarra]</div>
          <h3>Chamarra Mezclilla</h3>
          <p style="color: var(--text-gray); font-size: 0.9rem;">Talla: M</p>
          <div class="product-info">
            <span style="color: var(--brand-teal); font-weight: bold;">$850.00</span>
            <button class="btn btn-dark" style="padding: 6px 12px; font-size: 0.9rem;">+ Agregar</button>
          </div>
        </div>
        
        <!-- Tarjeta Producto 2 -->
        <div class="product-card">
          <div class="product-img">[Foto Camiseta]</div>
          <h3>Camiseta Básica</h3>
          <p style="color: var(--text-gray); font-size: 0.9rem;">Talla: L</p>
          <div class="product-info">
            <span style="color: var(--brand-teal); font-weight: bold;">$250.00</span>
            <button class="btn btn-dark" style="padding: 6px 12px; font-size: 0.9rem;">+ Agregar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SECCIÓN DERECHA: TICKET -->
    <div class="pos-ticket">
      <h2>Ticket Actual</h2>
      
      <!-- Detalle de Ticket -->
      <div class="ticket-items">
        <div class="ticket-item">
          <div>
            <div style="font-weight: bold;">Chamarra Mezclilla</div>
            <div style="color: var(--text-gray); font-size: 0.8rem;">1 x $850.00</div>
          </div>
          <div style="color: var(--brand-teal); font-weight: bold;">$850.00</div>
        </div>
      </div>

      <!-- Resumen y Acción -->
      <div class="ticket-total">
        <div class="total-row">
          <span>Total:</span>
          <span>$850.00</span>
        </div>
        <!-- Este botón abriría el modal mediante JavaScript -->
        <button class="btn btn-primary btn-checkout">Procesar Pago Seguro</button>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL DE PAGO SEGURO (Oculto por defecto en prod) -->
  <!-- ============================================== -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Procesar Pago</h2>
        <button class="modal-close" onclick="document.getElementById('paymentModal').style.display='none'">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="total-display">
          <p style="font-weight: bold; text-transform: uppercase; font-size: 0.85rem;">Total a Cobrar</p>
          <h3>$850.00</h3>
        </div>

        <p style="font-weight: bold; margin-bottom: 10px;">Método de Pago:</p>
        <div class="payment-methods">
          <button class="method-btn active">💳 Tarjeta</button>
          <button class="method-btn">💵 Efectivo</button>
        </div>

        <!-- Formulario a conectar con PaymentController (generando EncryptedPayloadDto) -->
        <button class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem;">
          Confirmar Cobro Seguro
        </button>
      </div>
    </div>
  </div>

</body>
</html>

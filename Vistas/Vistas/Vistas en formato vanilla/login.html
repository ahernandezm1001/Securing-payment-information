<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Empleado - Tienda Ropa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="icon-circle">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </div>
      <h1 style="color: var(--brand-dark);">Punto de Venta</h1>
      <p style="color: var(--brand-teal); font-weight: bold;">Acceso de Empleados</p>
    </div>

    <!-- Formulario a conectar con LoginController -->
    <form action="/api/login" method="POST">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ej. jperez" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-dark" style="width: 100%; margin-top: 10px;">
        Iniciar Sesión
      </button>
    </form>
  </div>

</body>
</html>

<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar pago</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Procesar Pago</h2>
        <button class="modal-close" onclick="document.getElementById('paymentModal').style.display='none'">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="total-display">
          <p style="font-weight: bold; text-transform: uppercase; font-size: 0.85rem;">Total a Cobrar</p>
          <h3>$850.00</h3>
        </div>

        <p style="font-weight: bold; margin-bottom: 10px;">Método de Pago:</p>
        <div class="payment-methods">
          <button class="method-btn active">💳 Tarjeta</button>
          <button class="method-btn">💵 Efectivo</button>
        </div>

        <!-- Formulario a conectar con PaymentController (generando EncryptedPayloadDto) -->
        <button class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem;">
          Confirmar Cobro Seguro
        </button>
      </div>
    </div>
  </div>
    </body>    
</html>
